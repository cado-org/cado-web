<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EA4C6"/>
      <stop offset="60%" stop-color="#C2D6E8"/>
      <stop offset="100%" stop-color="#E5EFF7"/>
    </linearGradient>
    <linearGradient id="concGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BA1A6"/>
      <stop offset="100%" stop-color="#6C7278"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C28D5A"/>
      <stop offset="100%" stop-color="#8F5E32"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2530"/>
      <stop offset="100%" stop-color="#0E151C"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Palm foliage on background left -->
  <path d="M 0 350 Q 80 320 120 400 Q 60 410 0 450 Z" fill="#3D5A38" opacity="0.7"/>
  <path d="M 0 280 Q 90 260 140 330 Q 70 360 0 380 Z" fill="#4B6E44" opacity="0.6"/>

  <!-- Construction Building Framework -->
  <!-- Level 1 Slabs -->
  <rect x="280" y="440" width="460" height="18" fill="#5A6065"/>
  <rect x="290" y="320" width="440" height="16" fill="#757B82"/>
  <rect x="300" y="200" width="420" height="15" fill="#888F96"/>
  <rect x="320" y="90" width="380" height="14" fill="#9DA4AB"/>

  <!-- Vertical Concrete Columns -->
  <rect x="310" y="90" width="22" height="420" fill="url(#concGrad)"/>
  <rect x="390" y="90" width="22" height="420" fill="url(#concGrad)"/>
  <rect x="470" y="90" width="22" height="420" fill="url(#concGrad)"/>
  <rect x="560" y="90" width="22" height="420" fill="url(#concGrad)"/>
  <rect x="650" y="90" width="22" height="420" fill="url(#concGrad)"/>

  <!-- Scaffolding & Formwork Details -->
  <line x1="310" y1="200" x2="390" y2="320" stroke="#C28D5A" stroke-width="4"/>
  <line x1="390" y1="200" x2="310" y2="320" stroke="#C28D5A" stroke-width="4"/>
  <line x1="390" y1="320" x2="470" y2="440" stroke="#C28D5A" stroke-width="4"/>
  <line x1="470" y1="320" x2="390" y2="440" stroke="#C28D5A" stroke-width="4"/>
  <line x1="470" y1="200" x2="560" y2="320" stroke="#D71920" stroke-width="3" opacity="0.8"/>
  <line x1="560" y1="200" x2="470" y2="320" stroke="#D71920" stroke-width="3" opacity="0.8"/>

  <!-- Top rebar protruding -->
  <line x1="315" y1="65" x2="315" y2="90" stroke="#4A4E52" stroke-width="3"/>
  <line x1="325" y1="70" x2="325" y2="90" stroke="#4A4E52" stroke-width="3"/>
  <line x1="395" y1="60" x2="395" y2="90" stroke="#4A4E52" stroke-width="3"/>
  <line x1="405" y1="68" x2="405" y2="90" stroke="#4A4E52" stroke-width="3"/>
  <line x1="475" y1="62" x2="475" y2="90" stroke="#4A4E52" stroke-width="3"/>

  <!-- Safety Railing Wire -->
  <line x1="280" y1="420" x2="740" y2="420" stroke="#E67E22" stroke-width="2.5"/>
  <line x1="290" y1="300" x2="730" y2="300" stroke="#E67E22" stroke-width="2.5"/>

  <!-- Construction Ground / Foundation Base -->
  <rect x="250" y="520" width="550" height="80" fill="#7A8086"/>

  <!-- Foreground: Professional Engineer / Inspector (From Back / Side Profile) -->
  <g id="engineer" transform="translate(40, 160)">
    <!-- Shoulders & Dark Navy Polo Shirt -->
    <path d="M 0 380 Q 50 310 130 290 Q 180 280 230 300 Q 290 325 320 380 L 320 440 L 0 440 Z" fill="url(#shirtGrad)"/>
    <path d="M 130 290 Q 170 305 210 295" stroke="#0A0F14" stroke-width="4" fill="none"/>

    <!-- Red CADO Logo on Back of Polo Shirt -->
    <g transform="translate(85, 330)">
      <!-- CADO Bull Icon Outline -->
      <path d="M 8 16 Q 14 6 24 10 Q 28 4 34 8 Q 28 14 26 22 Z" fill="#D71920"/>
      <!-- CADO text -->
      <text x="36" y="20" fill="#D71920" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" letter-spacing="1">CADO</text>
    </g>

    <!-- Neck & Skin -->
    <path d="M 145 230 L 195 230 L 190 285 L 150 285 Z" fill="#D29979"/>
    <!-- Ear & Head Side Profile -->
    <ellipse cx="195" cy="210" rx="12" ry="16" fill="#C28767"/>
    <path d="M 135 180 Q 130 230 155 245 Q 185 250 205 230 Q 215 190 190 160 Z" fill="#3D291F"/>

    <!-- White Hardhat / Safety Helmet -->
    <path d="M 125 175 Q 120 120 175 105 Q 235 110 240 170 Q 200 170 125 175 Z" fill="#F4F6F8"/>
    <!-- Hardhat Rim & Highlight -->
    <path d="M 115 175 C 130 168 220 162 250 175 C 235 180 130 182 115 175 Z" fill="#E1E5EA"/>
    <path d="M 140 130 Q 175 118 220 130" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
</svg>
